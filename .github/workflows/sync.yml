name: Sync data

on:
  schedule:
    - cron: '42 6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci

      - name: Sync Todoist tasks
        env:
          TODOIST_API_TOKEN: ${{ secrets.TODOIST_API_TOKEN }}
        run: node scripts/sync-todoist.mjs

      - name: Sync Google Calendar events
        env:
          GOOGLE_CALENDAR_CLIENT_ID: ${{ secrets.GOOGLE_CALENDAR_CLIENT_ID }}
          GOOGLE_CALENDAR_CLIENT_SECRET: ${{ secrets.GOOGLE_CALENDAR_CLIENT_SECRET }}
          GOOGLE_CALENDAR_REFRESH_TOKEN: ${{ secrets.GOOGLE_CALENDAR_REFRESH_TOKEN }}
          GOOGLE_CALENDAR_IDS: "will.jarvis@rdcontent.com,williamjarvis1996@gmail.com,mp2nj3alr30f36uoan8585r1mp67kb91@import.calendar.google.com,3149faf4ef70812be77b26ccbfbd422038e76b3997af61b4f85db2fa3a4f2288@group.calendar.google.com"
          GOOGLE_CALENDAR_MAP: '{"will.jarvis@rdcontent.com":"work","williamjarvis1996@gmail.com":"personal","mp2nj3alr30f36uoan8585r1mp67kb91@import.calendar.google.com":"fitness","3149faf4ef70812be77b26ccbfbd422038e76b3997af61b4f85db2fa3a4f2288@group.calendar.google.com":"create"}'
        run: node scripts/sync-calendar.mjs

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/content/sync/
          if git diff --cached --quiet; then
            echo "No data changes to commit."
          else
            git commit -m "chore: sync Todoist and Calendar data"
            git push
          fi
